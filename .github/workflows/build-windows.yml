name: Build Windows
on:
  push:
    paths:
      - 'winapp/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build
        working-directory: winapp
        env: { CGO_ENABLED: '1' }
        run: |
          go mod tidy
          go build -ldflags="-s -w -H windowsgui" -o clouddisk_amd64.exe .
      - uses: actions/upload-artifact@v4
        with: { name: clouddisk-amd64, path: winapp/clouddisk_amd64.exe }

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Setup llvm-mingw
        run: |
          curl -L -o llvm.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar xf llvm.zip
          echo "$PWD/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
      - name: Build
        working-directory: winapp
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: arm64
          CC: aarch64-w64-mingw32-clang
        run: |
          go mod tidy
          go build -ldflags="-s -w -H windowsgui" -o clouddisk_arm64.exe .
      - uses: actions/upload-artifact@v4
        with: { name: clouddisk-arm64, path: winapp/clouddisk_arm64.exe }
