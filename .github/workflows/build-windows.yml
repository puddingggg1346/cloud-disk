name: Build Windows
on:
  push:
    paths:
      - 'winapp/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        working-directory: winapp
        env:
          CGO_ENABLED: '1'
        run: |
          go mod tidy
          env GOARCH=arm64 go build -ldflags="-s -w -H windowsgui" -o clouddisk_arm64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: clouddisk-windows
          path: winapp/clouddisk.exe
